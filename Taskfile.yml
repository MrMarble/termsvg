# https://taskfile.dev

version: "3"

env:
  GO111MODULE: on
  GOPROXY: https://proxy.golang.org,direct

tasks:
  setup:
    desc: Prepare development environment
    cmds:
      - go install mvdan.cc/gofumpt@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/goreleaser/goreleaser@latest
      - pre-commit install
      - pre-commit install --hook-type commit-msg
      - go mod tidy

  build:
    desc: Build the binary
    sources:
      - ./**/*.go
    generates:
      - ./goreleaser
    cmds:
      - go build ./cmd/termsvg

  test:
    desc: Run tests
    env:
      LC_ALL: C
    vars:
      TEST_OPTIONS: '{{default "" .TEST_OPTIONS}}'
      SOURCE_FILES: '{{default "./..." .SOURCE_FILES}}'
      TEST_PATTERN: '{{default "." .TEST_PATTERN}}'
    cmds:
      - go test {{.TEST_OPTIONS}} -failfast -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.txt {{.SOURCE_FILES}} -run {{.TEST_PATTERN}} -timeout=5m

  cover:
    desc: Open the cover tool
    cmds:
      - go tool cover -html=coverage.txt

  fmt:
    desc: gofumpt all code
    cmds:
      - gofumpt -w -l .

  lint:
    desc: Lint the code with golangci-lint
    cmds:
      - golangci-lint run --fix ./...

  ci:
    desc: Run all CI steps
    cmds:
      - task: lint
      - task: test
      - task: build

  default:
    desc: Runs the default tasks
    cmds:
      - task: ci

  release:
    desc: Create a new tag
    vars:
      NEXT:
        sh: svu n
    cmds:
      - git tag {{.NEXT}}
      - echo {{.NEXT}}
      - git push origin --tags

  examples:
    desc: Regenerate all examples (SVG, GIF, WebM) and the size table
    cmds:
      - task: examples:svg
      - task: examples:gif
      - task: examples:webm
      - ./scripts/update-filesize.sh

  examples:svg:
    desc: Regenerate the SVG examples
    deps:
      - build
    sources:
      - ./examples/*.cast
      - ./termsvg
    generates:
      - ./examples/*.svg
    cmds:
      - ./termsvg export "examples/256colors.cast" -m --svg-layout=bands --svg-animation=smil --svg-frame-switch=href --svg-style=auto -o "examples/256colors.svg"
      - ./termsvg export "examples/444816.cast" -m --svg-layout=frames --svg-animation=smil --svg-frame-switch=href --svg-max-fps=30 -o "examples/444816.svg"
      - ./termsvg export "examples/444816.cast" -m -n --svg-layout=frames --svg-animation=smil --svg-frame-switch=href --svg-max-fps=30 -o "examples/444816_borderless.svg"
      - ./termsvg export "examples/htop.cast" -m --svg-layout=frames --svg-animation=smil --svg-frame-switch=href --svg-max-fps=30 --svg-style=auto -o "examples/htop.svg"
      - ./termsvg export "examples/rgb.cast" -m --svg-layout=regions --svg-animation=smil --svg-frame-switch=translate --svg-max-fps=30 --svg-style=auto -o "examples/rgb.svg"
      - ./termsvg export "examples/session.cast" -m --svg-layout=bands --svg-animation=smil --svg-frame-switch=href --svg-max-fps=30 --svg-style=auto -o "examples/session.svg"

  examples:gif:
    desc: Regenerate the GIF examples
    deps:
      - build
    sources:
      - ./examples/*.cast
      - ./termsvg
    generates:
      - ./examples/*.gif
    cmds:
      - ./termsvg export "examples/htop.cast" -f gif -o "examples/htop.gif"
      - ./termsvg export "examples/rgb.cast" -f gif -o "examples/rgb.gif"
      - ./termsvg export "examples/session.cast" -f gif -o "examples/session.gif"

  examples:webm:
    desc: Regenerate the WebM examples (requires ffmpeg with libvpx-vp9)
    deps:
      - build
    preconditions:
      - sh: command -v ffmpeg
        msg: ffmpeg is required to export WebM; install it from https://ffmpeg.org
    sources:
      - ./examples/*.cast
      - ./termsvg
    generates:
      - ./examples/*.webm
    cmds:
      - ./termsvg export "examples/htop.cast" -f webm -o "examples/htop.webm"
      - ./termsvg export "examples/rgb.cast" -f webm -o "examples/rgb.webm"
      - ./termsvg export "examples/session.cast" -f webm -o "examples/session.webm"

  examples:verify:
    desc: Regenerate examples and fail if tracked artifacts or size documentation drift
    cmds:
      - task: examples
      - git diff --exit-code -- examples

  svg-layout-matrix:
    desc: Compare SVG layout and animation representations for a cast
    deps:
      - build
    cmds:
      - ./scripts/svg-layout-matrix.sh {{.CLI_ARGS}}

  goreleaser:
    desc: Run GoReleaser either in snapshot or release mode
    deps:
      - build
    vars:
      SNAPSHOT:
        sh: 'if [[ $GITHUB_REF != refs/tags/v* ]]; then echo "--snapshot"; fi'
    cmds:
      - goreleaser release --rm-dist {{.SNAPSHOT}}
